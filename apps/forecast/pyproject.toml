[project]
name = "mealsense-forecast"
version = "1.0.0"
description = "MealSense Attendance Forecasting and Conformal Prediction Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.1.post1",
    "supabase>=2.4.0",
    "python-jose[cryptography]>=3.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
