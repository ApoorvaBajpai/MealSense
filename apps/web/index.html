<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MealSense — Dining Intelligence Platform</title>
  <meta name="description" content="Institutional dining & food-waste prevention platform. Intent tracking, ML forecasting, and zero-waste kitchen decisions.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFF7E6">

  <!-- Typography: Plus Jakarta Sans + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Design System -->
  <link rel="stylesheet" href="styles/design-tokens.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/student.css">
  <link rel="stylesheet" href="styles/kitchen.css">
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>

  <!-- ── App Header ───────────────────────────────────────── -->
  <header class="app-header">
    <a href="#" class="brand" aria-label="MealSense Home">
      <div class="brand-icon">🍽️</div>
      <div class="brand-name-group">
        <div class="brand-title">MealSense</div>
        <div class="brand-subtitle">Dining Intelligence</div>
      </div>
    </a>
    <!-- Populated by app.js -->
    <div id="header-nav-container" style="display:flex;align-items:center;gap:8px;"></div>
  </header>

  <!-- ── Demo Mode Banner ──────────────────────────────────── -->
  <div id="demo-mode-banner" class="demo-mode-banner" style="display:none;"></div>

  <!-- ── Guided PM Tour Banner ────────────────────────────── -->
  <div id="guided-tour-banner" class="guided-tour-banner" style="display:none;"></div>

  <!-- ── Main View (role-based) ───────────────────────────── -->
  <main class="app-main" id="view-container" role="main"></main>

  <!-- ── Modal ────────────────────────────────────────────── -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content" id="modal-body"></div>
  </div>

  <!-- ── Toast Hub ────────────────────────────────────────── -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- ── App Bootstrap ────────────────────────────────────── -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
